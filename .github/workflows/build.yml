name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build GUI
        run: cargo build --release --target ${{ matrix.target }} --bin ui

      - name: Bundle vgmstream (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p target/release/tools/vgmstream
          curl -L -o vgmstream.zip https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-win64.zip
          unzip vgmstream.zip -d target/release/tools/vgmstream

      - name: Bundle vgmstream (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p target/release/tools/vgmstream
          curl -L -o vgmstream.tar.gz https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-linux-cli.tar.gz
          tar xzf vgmstream.tar.gz -C target/release/tools/vgmstream

      - name: Bundle vgmstream (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/release/tools/vgmstream
          curl -L -o vgmstream.tar.gz https://github.com/vgmstream/vgmstream-releases/releases/download/nightly/vgmstream-mac-cli.tar.gz
          tar xzf vgmstream.tar.gz -C target/release/tools/vgmstream
          chmod +x target/release/tools/vgmstream/vgmstream-cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fmod_bank_decoder.exe dist/
          cp target/${{ matrix.target }}/release/ui.exe dist/
          cp -r target/release/tools dist/
          cp README.md dist/
          cp LICENSE dist/
          7z a fmod_bank_decoder-${{ matrix.target }}.zip dist/*

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fmod_bank_decoder dist/
          cp target/${{ matrix.target }}/release/ui dist/
          cp -r target/release/tools dist/
          cp README.md LICENSE dist/
          tar czf fmod_bank_decoder-${{ matrix.target }}.tar.gz -C dist .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fmod_bank_decoder dist/
          cp target/${{ matrix.target }}/release/ui dist/
          cp -r target/release/tools dist/
          cp README.md LICENSE dist/
          chmod +x dist/fmod_bank_decoder dist/ui
          tar czf fmod_bank_decoder-${{ matrix.target }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmod_bank_decoder-${{ matrix.target }}
          path: |
            fmod_bank_decoder-${{ matrix.target }}.zip
            fmod_bank_decoder-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
