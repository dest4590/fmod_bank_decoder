[package]
name = "fmod_bank_decoder"
version = "0.1.0"
edition = "2021"
description = "Fast FMOD bank decoder for games like Noita"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
hound = "3.5.1"
memmap2 = "0.9.11"
byteorder = "1.5.0"
anyhow = "1.0.104"
rayon = "1.12.0"
indicatif = "0.18.6"
lewton = "0.10.2"
ogg = "0.9.2"
eframe = "0.35.0"
egui_extras = "0.35.0"
rfd = "0.17.2"
num_cpus = "1.17.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
